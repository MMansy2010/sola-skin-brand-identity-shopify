<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" width="900" height="1100">
  <defs>
    <linearGradient id="bgGradCream" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5" />
      <stop offset="65%" stop-color="#F2EDE4" />
      <stop offset="100%" stop-color="#E5DDD0" />
    </linearGradient>
    <linearGradient id="goldLid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9C753B" />
      <stop offset="15%" stop-color="#DEBE89" />
      <stop offset="35%" stop-color="#FFF0D1" />
      <stop offset="60%" stop-color="#DEBE89" />
      <stop offset="85%" stop-color="#C29B5D" />
      <stop offset="100%" stop-color="#805B24" />
    </linearGradient>
    <linearGradient id="jarBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EBE3D7" />
      <stop offset="15%" stop-color="#FDFBF7" />
      <stop offset="50%" stop-color="#F7F3EC" />
      <stop offset="85%" stop-color="#EDE4D8" />
      <stop offset="100%" stop-color="#DCD0C0" />
    </linearGradient>
    <radialGradient id="jarPedestal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D9CFC1" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#EFE9DF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#EFE9DF" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadowJar" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16" />
      <feOffset dx="0" dy="24" result="offsetblur" />
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="1100" fill="url(#bgGradCream)"/>
  
  <circle cx="450" cy="580" r="340" fill="none" stroke="#D4AF7A" stroke-opacity="0.2" stroke-width="1.2"/>
  <circle cx="450" cy="580" r="310" fill="none" stroke="#D4AF7A" stroke-opacity="0.1" stroke-width="0.8" stroke-dasharray="4 6"/>
  <ellipse cx="450" cy="910" rx="270" ry="40" fill="url(#jarPedestal)" />

  <!-- Drop Shadow -->
  <ellipse cx="450" cy="855" rx="210" ry="24" fill="#3E382E" opacity="0.34" filter="blur(14px)"/>
  <ellipse cx="450" cy="850" rx="160" ry="12" fill="#201C17" opacity="0.45" filter="blur(6px)"/>

  <!-- Jar Group -->
  <g filter="url(#softShadowJar)">
    <!-- Jar Body (Ivory Matte Ceramic / Thick Glass) -->
    <path d="M 235 560 C 235 530, 260 515, 300 515 L 600 515 C 640 515, 665 530, 665 560 L 665 790 C 665 830, 630 848, 590 848 L 310 848 C 270 848, 235 830, 235 790 Z" fill="url(#jarBody)" stroke="#FFFFFF" stroke-width="1.5"/>

    <!-- Jar Rim Highlight -->
    <path d="M 245 520 L 245 790 C 245 815, 265 835, 300 835" stroke="#FFFFFF" stroke-width="3" fill="none" opacity="0.7"/>

    <!-- Front Label Area on Jar -->
    <rect x="290" y="555" width="320" height="235" rx="6" fill="#FDFBF8" stroke="#E5DAC9" stroke-width="0.8"/>
    <rect x="298" y="563" width="304" height="219" rx="4" fill="none" stroke="#D4AF7A" stroke-width="0.75" stroke-opacity="0.6"/>

    <!-- Brand on Jar -->
    <path d="M 425 595 Q 450 580 475 595" fill="none" stroke="#D4AF7A" stroke-width="1" stroke-linecap="round"/>
    <text x="450" y="622" font-family="'Cormorant Garamond', Georgia, serif" font-size="30" font-weight="500" text-anchor="middle" fill="#1A1A1A">Sola</text>
    <line x1="430" y1="632" x2="442" y2="632" stroke="#D4AF7A" stroke-width="0.75"/>
    <line x1="458" y1="632" x2="470" y2="632" stroke="#D4AF7A" stroke-width="0.75"/>
    <text x="451" y="635" font-family="'Montserrat', sans-serif" font-size="8" letter-spacing="2" text-anchor="middle" fill="#1A1A1A">Skin</text>

    <line x1="390" y1="660" x2="510" y2="660" stroke="#E3DACD" stroke-width="0.75"/>

    <text x="450" y="692" font-family="'Montserrat', sans-serif" font-size="10.5" font-weight="600" letter-spacing="3" text-anchor="middle" fill="#1A1A1A">CREMĂ HIDRATANTĂ</text>
    <text x="450" y="712" font-family="'Cormorant Garamond', Georgia, serif" font-style="italic" font-size="14" text-anchor="middle" fill="#A89B8A">Hydrating Cream</text>

    <line x1="430" y1="730" x2="470" y2="730" stroke="#D4AF7A" stroke-width="0.5"/>

    <text x="450" y="756" font-family="'Montserrat', sans-serif" font-size="8" font-weight="500" letter-spacing="2" text-anchor="middle" fill="#77716B">50 ML · 1.7 FL. OZ.</text>
    <text x="450" y="770" font-family="'Montserrat', sans-serif" font-size="6.5" font-weight="400" letter-spacing="1.5" text-anchor="middle" fill="#8C847A">RITUAL ZILNIC DE ÎNGRIJIRE</text>

    <!-- Champagne Gold Jar Lid -->
    <path d="M 230 455 C 230 445, 245 435, 275 435 L 625 435 C 655 435, 670 445, 670 455 L 670 515 L 230 515 Z" fill="url(#goldLid)"/>
    <line x1="230" y1="508" x2="670" y2="508" stroke="#7A5620" stroke-width="1.5"/>
    <line x1="240" y1="445" x2="660" y2="445" stroke="#FFF5DE" stroke-width="1.5" opacity="0.8"/>
  </g>

  <text x="450" y="1030" font-family="'Montserrat', sans-serif" font-size="11" font-weight="500" letter-spacing="4" text-anchor="middle" fill="#77716B">SOLA SKIN · RITUAL 02</text>
</svg>