<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" width="900" height="1100">
  <defs>
    <linearGradient id="bgGradClean" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5" />
      <stop offset="65%" stop-color="#F2EDE4" />
      <stop offset="100%" stop-color="#E5DDD0" />
    </linearGradient>
    <linearGradient id="tubeBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DCD4C6" />
      <stop offset="18%" stop-color="#FAF8F4" />
      <stop offset="50%" stop-color="#F4EFE6" />
      <stop offset="82%" stop-color="#ECE4D6" />
      <stop offset="100%" stop-color="#CEBFAF" />
    </linearGradient>
    <linearGradient id="goldCap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9C753B" />
      <stop offset="25%" stop-color="#E6C894" />
      <stop offset="50%" stop-color="#FFF2D6" />
      <stop offset="75%" stop-color="#D4AF7A" />
      <stop offset="100%" stop-color="#7A5620" />
    </linearGradient>
    <radialGradient id="cleanPedestal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D9CFC1" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#EFE9DF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#EFE9DF" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadowTube" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16" />
      <feOffset dx="0" dy="24" result="offsetblur" />
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="1100" fill="url(#bgGradClean)"/>
  
  <circle cx="450" cy="540" r="340" fill="none" stroke="#D4AF7A" stroke-opacity="0.2" stroke-width="1.2"/>
  <circle cx="450" cy="540" r="310" fill="none" stroke="#D4AF7A" stroke-opacity="0.1" stroke-width="0.8" stroke-dasharray="4 6"/>
  <ellipse cx="450" cy="930" rx="260" ry="40" fill="url(#cleanPedestal)" />

  <!-- Shadow -->
  <ellipse cx="450" cy="880" rx="130" ry="16" fill="#3E382E" opacity="0.32" filter="blur(12px)"/>
  <ellipse cx="450" cy="876" rx="90" ry="8" fill="#201C17" opacity="0.45" filter="blur(5px)"/>

  <!-- Tube Group -->
  <g filter="url(#softShadowTube)">
    <!-- Tube Crimp at top -->
    <rect x="330" y="240" width="240" height="18" rx="2" fill="#D3C7B6" stroke="#B8A894" stroke-width="0.5"/>
    <line x1="335" y1="245" x2="565" y2="245" stroke="#FFFFFF" stroke-width="1" opacity="0.8"/>
    <line x1="335" y1="252" x2="565" y2="252" stroke="#A6947E" stroke-width="0.8"/>

    <!-- Slender Matte Tube Body -->
    <path d="M 330 258 L 360 800 C 360 805, 365 810, 375 810 L 525 810 C 535 810, 540 805, 540 800 L 570 258 Z" fill="url(#tubeBody)"/>
    
    <!-- Specular Highlight Line on Left Edge -->
    <path d="M 352 270 L 378 790" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

    <!-- Printed Graphics directly on matte ivory tube surface -->
    <!-- Mini Gold Arc -->
    <path d="M 425 410 Q 450 395 475 410" fill="none" stroke="#D4AF7A" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="450" cy="400" r="1.5" fill="#D4AF7A"/>
    
    <text x="450" y="448" font-family="'Cormorant Garamond', Georgia, serif" font-size="38" font-weight="500" text-anchor="middle" fill="#1A1A1A">Sola</text>
    
    <line x1="425" y1="462" x2="438" y2="462" stroke="#D4AF7A" stroke-width="1"/>
    <line x1="462" y1="462" x2="475" y2="462" stroke="#D4AF7A" stroke-width="1"/>
    <text x="451" y="466" font-family="'Montserrat', sans-serif" font-size="10" letter-spacing="3" text-anchor="middle" fill="#1A1A1A">Skin</text>

    <line x1="390" y1="520" x2="510" y2="520" stroke="#D4AF7A" stroke-width="0.8"/>

    <text x="450" y="565" font-family="'Montserrat', sans-serif" font-size="11" font-weight="600" letter-spacing="3" text-anchor="middle" fill="#1A1A1A">GEL DE CURĂȚARE DELICAT</text>
    <text x="450" y="590" font-family="'Cormorant Garamond', Georgia, serif" font-style="italic" font-size="16" text-anchor="middle" fill="#A89B8A">Gentle Cleanser</text>

    <line x1="430" y1="620" x2="470" y2="620" stroke="#D4AF7A" stroke-width="0.75"/>

    <text x="450" y="660" font-family="'Montserrat', sans-serif" font-size="9" font-weight="500" letter-spacing="2.5" text-anchor="middle" fill="#77716B">100 ML · 3.4 FL. OZ.</text>
    
    <text x="450" y="705" font-family="'Montserrat', sans-serif" font-size="7.5" font-weight="500" letter-spacing="2" text-anchor="middle" fill="#8C847A">PURITATE &amp; ECHILIBRU</text>
    <text x="450" y="725" font-family="'Montserrat', sans-serif" font-size="7" font-weight="400" letter-spacing="1.5" text-anchor="middle" fill="#A89E92">ÎNGRIJIRE ZILNICĂ · ROMANIA</text>

    <!-- Flip Top Cap (Champagne Gold Metallic Cylinder at bottom) -->
    <rect x="370" y="810" width="160" height="65" rx="4" fill="url(#goldCap)"/>
    <line x1="370" y1="835" x2="530" y2="835" stroke="#7A5620" stroke-width="1.2"/>
    <line x1="375" y1="815" x2="525" y2="815" stroke="#FFF2D6" stroke-width="1" opacity="0.7"/>
    <rect x="430" y="830" width="40" height="8" rx="2" fill="#7A5620" opacity="0.7"/>
  </g>

  <text x="450" y="1030" font-family="'Montserrat', sans-serif" font-size="11" font-weight="500" letter-spacing="4" text-anchor="middle" fill="#77716B">Sola Skin · Ritual 03</text>
</svg>