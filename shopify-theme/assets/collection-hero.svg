<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8F6F1" />
      <stop offset="40%" stop-color="#F2EDE4" />
      <stop offset="100%" stop-color="#E8DFD1" />
    </linearGradient>
    <linearGradient id="pedestalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EDE6D8" />
      <stop offset="100%" stop-color="#D9CEC0" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="50%" stop-color="#D4AF7A" />
      <stop offset="100%" stop-color="#A67C3D" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFFDF7" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#F9F5EC" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F2EDE4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1000" fill="url(#heroBg)"/>
  <rect width="1600" height="1000" fill="url(#sunGlow)"/>

  <!-- Architectural Background Elements -->
  <!-- Huge fine gold circular arc symbolizing radiance and care -->
  <circle cx="800" cy="500" r="420" fill="none" stroke="url(#goldAccent)" stroke-opacity="0.35" stroke-width="1.5"/>
  <circle cx="800" cy="500" r="390" fill="none" stroke="url(#goldAccent)" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="6 8"/>

  <!-- Minimal stone travertine block pedestal -->
  <path d="M 320 780 L 1280 780 L 1320 860 L 280 860 Z" fill="url(#pedestalGrad)"/>
  <line x1="280" y1="860" x2="1320" y2="860" stroke="#BAAA96" stroke-width="1.5"/>
  <ellipse cx="800" cy="850" rx="600" ry="40" fill="#2D2821" opacity="0.18" filter="blur(20px)"/>

  <!-- Gentle Cleanser on Left (scaled & positioned) -->
  <g transform="translate(420, 260) scale(0.68)">
    <!-- Shadow -->
    <ellipse cx="450" cy="880" rx="130" ry="16" fill="#3E382E" opacity="0.35" filter="blur(12px)"/>
    <!-- Tube Crimp -->
    <rect x="330" y="240" width="240" height="18" rx="2" fill="#D3C7B6" stroke="#B8A894" stroke-width="0.5"/>
    <path d="M 330 258 L 360 800 C 360 805, 365 810, 375 810 L 525 810 C 535 810, 540 805, 540 800 L 570 258 Z" fill="#F4EFE6" stroke="#E3DACB" stroke-width="1"/>
    <path d="M 352 270 L 378 790" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <path d="M 425 410 Q 450 395 475 410" fill="none" stroke="#D4AF7A" stroke-width="1.2"/>
    <text x="450" y="448" font-family="'Cormorant Garamond', serif" font-size="38" text-anchor="middle" fill="#1A1A1A">Sola</text>
    <text x="451" y="466" font-family="'Montserrat', sans-serif" font-size="10" letter-spacing="3" text-anchor="middle" fill="#1A1A1A">Skin</text>
    <text x="450" y="565" font-family="'Montserrat', sans-serif" font-size="11" font-weight="600" letter-spacing="3" text-anchor="middle" fill="#1A1A1A">GEL DE CURĂȚARE</text>
    <text x="450" y="660" font-family="'Montserrat', sans-serif" font-size="9" font-weight="500" letter-spacing="2.5" text-anchor="middle" fill="#77716B">100 ML</text>
    <rect x="370" y="810" width="160" height="65" rx="4" fill="#D4AF7A"/>
  </g>

  <!-- Renewing Face Serum in Center (Hero position) -->
  <g transform="translate(620, 210) scale(0.8)">
    <ellipse cx="450" cy="890" rx="140" ry="16" fill="#3A3329" opacity="0.4" filter="blur(14px)"/>
    <!-- Glass Bottle Body -->
    <rect x="330" y="380" width="240" height="490" rx="36" fill="#FAF6EE" stroke="#FFFFFF" stroke-width="2"/>
    <!-- Inner serum -->
    <path d="M 345 520 C 345 520, 390 514, 450 514 C 510 514, 555 520, 555 520 L 555 840 C 555 865, 535 880, 510 880 L 390 880 C 365 880, 345 865, 345 840 Z" fill="#F4E6C4" opacity="0.85"/>
    <!-- Label -->
    <rect x="355" y="490" width="190" height="280" rx="6" fill="#FDFCF9" stroke="#E5DEC3" stroke-width="0.8"/>
    <rect x="362" y="497" width="176" height="266" rx="4" fill="none" stroke="#D4AF7A" stroke-width="0.75"/>
    <path d="M 425 530 Q 450 515 475 530" fill="none" stroke="#D4AF7A" stroke-width="1"/>
    <text x="450" y="556" font-family="'Cormorant Garamond', serif" font-size="28" font-weight="500" text-anchor="middle" fill="#1A1A1A">Sola</text>
    <text x="451" y="568" font-family="'Montserrat', sans-serif" font-size="7.5" letter-spacing="2" text-anchor="middle" fill="#1A1A1A">Skin</text>
    <text x="450" y="622" font-family="'Montserrat', sans-serif" font-size="9" font-weight="600" letter-spacing="3" text-anchor="middle" fill="#1A1A1A">SERUM PENTRU FAȚĂ</text>
    <text x="450" y="695" font-family="'Montserrat', sans-serif" font-size="7.5" letter-spacing="2" text-anchor="middle" fill="#77716B">30 ML</text>
    <!-- Dropper Collar & Bulb -->
    <rect x="400" y="325" width="100" height="60" rx="3" fill="#D4AF7A"/>
    <path d="M 420 325 C 418 275, 412 215, 450 215 C 488 215, 482 275, 480 325 Z" fill="#1A1A1A"/>
  </g>

  <!-- Hydrating Cream on Right -->
  <g transform="translate(860, 310) scale(0.66)">
    <ellipse cx="450" cy="855" rx="210" ry="24" fill="#3E382E" opacity="0.38" filter="blur(14px)"/>
    <!-- Jar Body -->
    <path d="M 235 560 C 235 530, 260 515, 300 515 L 600 515 C 640 515, 665 530, 665 560 L 665 790 C 665 830, 630 848, 590 848 L 310 848 C 270 848, 235 830, 235 790 Z" fill="#F7F3EC" stroke="#FFFFFF" stroke-width="1.5"/>
    <!-- Label -->
    <rect x="290" y="555" width="320" height="235" rx="6" fill="#FDFBF8" stroke="#E5DAC9" stroke-width="0.8"/>
    <rect x="298" y="563" width="304" height="219" rx="4" fill="none" stroke="#D4AF7A" stroke-width="0.75"/>
    <text x="450" y="622" font-family="'Cormorant Garamond', serif" font-size="30" font-weight="500" text-anchor="middle" fill="#1A1A1A">Sola</text>
    <text x="451" y="635" font-family="'Montserrat', sans-serif" font-size="8" letter-spacing="2" text-anchor="middle" fill="#1A1A1A">Skin</text>
    <text x="450" y="692" font-family="'Montserrat', sans-serif" font-size="10.5" font-weight="600" letter-spacing="3" text-anchor="middle" fill="#1A1A1A">CREMĂ HIDRATANTĂ</text>
    <text x="450" y="756" font-family="'Montserrat', sans-serif" font-size="8" letter-spacing="2" text-anchor="middle" fill="#77716B">50 ML</text>
    <!-- Gold Lid -->
    <path d="M 230 455 C 230 445, 245 435, 275 435 L 625 435 C 655 435, 670 445, 670 455 L 670 515 L 230 515 Z" fill="#D4AF7A"/>
  </g>

  <!-- Ambient lighting beam -->
  <polygon points="1200,0 1600,0 1500,1000 900,1000" fill="#FFFFFF" opacity="0.08"/>

  <!-- Watermark / subtle branding -->
  <text x="800" y="930" font-family="'Montserrat', sans-serif" font-size="12" font-weight="500" letter-spacing="6" text-anchor="middle" fill="#77716B">Sola Skin · Ritualul tău zilnic</text>
</svg>