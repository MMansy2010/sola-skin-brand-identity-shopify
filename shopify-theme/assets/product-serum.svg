<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" width="900" height="1100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5" />
      <stop offset="65%" stop-color="#F2EDE4" />
      <stop offset="100%" stop-color="#E5DDD0" />
    </linearGradient>
    <radialGradient id="serumPedestal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D9CFC1" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#EFE9DF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#EFE9DF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dropperBulb" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D2B29" />
      <stop offset="30%" stop-color="#1A1A1A" />
      <stop offset="70%" stop-color="#151413" />
      <stop offset="100%" stop-color="#32302E" />
    </linearGradient>
    <linearGradient id="goldCollar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A57D42" />
      <stop offset="25%" stop-color="#E6C894" />
      <stop offset="50%" stop-color="#FFF2D6" />
      <stop offset="75%" stop-color="#D4AF7A" />
      <stop offset="100%" stop-color="#8C6630" />
    </linearGradient>
    <linearGradient id="glassBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="12%" stop-color="#FDFBF7" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#F5F0E6" stop-opacity="0.25" />
      <stop offset="88%" stop-color="#F7F3EB" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="serumFluid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EED7A1" stop-opacity="0.75" />
      <stop offset="40%" stop-color="#F6E7C4" stop-opacity="0.55" />
      <stop offset="70%" stop-color="#F9EED4" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#E2C584" stop-opacity="0.8" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16" />
      <feOffset dx="0" dy="24" result="offsetblur" />
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="1100" fill="url(#bgGrad)"/>
  
  <!-- Subtle luxury background halo & geometric gold circle -->
  <circle cx="450" cy="560" r="340" fill="none" stroke="#D4AF7A" stroke-opacity="0.2" stroke-width="1.2"/>
  <circle cx="450" cy="560" r="310" fill="none" stroke="#D4AF7A" stroke-opacity="0.1" stroke-width="0.8" stroke-dasharray="4 6"/>
  <ellipse cx="450" cy="940" rx="260" ry="40" fill="url(#serumPedestal)" />

  <!-- Studio Drop Shadow for Bottle -->
  <ellipse cx="450" cy="890" rx="140" ry="16" fill="#4A443A" opacity="0.32" filter="blur(14px)"/>
  <ellipse cx="450" cy="886" rx="100" ry="8" fill="#25211B" opacity="0.45" filter="blur(6px)"/>

  <!-- Bottle Group with Filter -->
  <g filter="url(#softShadow)">
    <!-- Inner Pipette Tube (subtle) -->
    <rect x="444" y="390" width="12" height="420" rx="4" fill="#FFFFFF" opacity="0.65"/>
    <rect x="447" y="390" width="6" height="420" fill="#ECD398" opacity="0.5"/>

    <!-- Serum Fluid (Inside frosted glass) -->
    <path d="M 345 520 C 345 520, 390 514, 450 514 C 510 514, 555 520, 555 520 L 555 840 C 555 865, 535 880, 510 880 L 390 880 C 365 880, 345 865, 345 840 Z" fill="url(#serumFluid)"/>

    <!-- Frosted Glass Bottle Body -->
    <rect x="330" y="380" width="240" height="490" rx="36" fill="url(#glassBody)" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
    <!-- Glass Thickness Base Rim -->
    <path d="M 345 850 C 345 870, 365 880, 450 880 C 535 880, 555 870, 555 850 C 555 860, 535 872, 450 872 C 365 872, 345 860, 345 850 Z" fill="#EADBC6" opacity="0.7"/>

    <!-- Premium Product Label -->
    <rect x="355" y="490" width="190" height="280" rx="6" fill="#FDFCF9" stroke="#E5DEC3" stroke-width="0.8"/>
    <!-- Thin Gold Hairline Border inside label -->
    <rect x="362" y="497" width="176" height="266" rx="4" fill="none" stroke="#D4AF7A" stroke-width="0.75" stroke-opacity="0.6"/>

    <!-- Brand Header on Label -->
    <!-- Mini Gold Arc -->
    <path d="M 425 530 Q 450 515 475 530" fill="none" stroke="#D4AF7A" stroke-width="1" stroke-linecap="round"/>
    <text x="450" y="556" font-family="'Cormorant Garamond', Georgia, serif" font-size="28" font-weight="500" text-anchor="middle" fill="#1A1A1A">Sola</text>
    <line x1="432" y1="565" x2="442" y2="565" stroke="#D4AF7A" stroke-width="0.75"/>
    <line x1="458" y1="565" x2="468" y2="565" stroke="#D4AF7A" stroke-width="0.75"/>
    <text x="451" y="568" font-family="'Montserrat', sans-serif" font-size="7.5" letter-spacing="2" text-anchor="middle" fill="#1A1A1A">Skin</text>

    <!-- Product Title & Details in Romanian -->
    <line x1="410" y1="592" x2="490" y2="592" stroke="#E3DACD" stroke-width="0.75"/>
    <text x="450" y="622" font-family="'Montserrat', sans-serif" font-size="9" font-weight="600" letter-spacing="3" text-anchor="middle" fill="#1A1A1A">SERUM PENTRU FAȚĂ</text>
    <text x="450" y="640" font-family="'Cormorant Garamond', Georgia, serif" font-style="italic" font-size="13" text-anchor="middle" fill="#A89B8A">Renewing Face Serum</text>

    <line x1="430" y1="662" x2="470" y2="662" stroke="#D4AF7A" stroke-width="0.5"/>

    <text x="450" y="695" font-family="'Montserrat', sans-serif" font-size="7.5" font-weight="500" letter-spacing="2" text-anchor="middle" fill="#77716B">30 ML · 1.0 FL. OZ.</text>
    <text x="450" y="725" font-family="'Montserrat', sans-serif" font-size="6.5" font-weight="400" letter-spacing="1.5" text-anchor="middle" fill="#8C847A">FORMULĂ DELICATĂ</text>
    <text x="450" y="738" font-family="'Montserrat', sans-serif" font-size="6" font-weight="400" letter-spacing="1" text-anchor="middle" fill="#A89E92">ROMANIA</text>

    <!-- Glossy Reflection Highlight Line on Glass -->
    <path d="M 342 410 L 342 850" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <path d="M 350 420 L 350 840" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

    <!-- Dropper Collar (Champagne Gold Metallic) -->
    <rect x="400" y="325" width="100" height="60" rx="3" fill="url(#goldCollar)"/>
    <!-- Subtle ridges on gold collar -->
    <line x1="400" y1="335" x2="500" y2="335" stroke="#FFF2D6" stroke-width="1" opacity="0.6"/>
    <line x1="400" y1="375" x2="500" y2="375" stroke="#8C6630" stroke-width="1" opacity="0.5"/>

    <!-- Dropper Pipette Bulb (Matte Obsidian Black) -->
    <path d="M 420 325 C 418 275, 412 215, 450 215 C 488 215, 482 275, 480 325 Z" fill="url(#dropperBulb)"/>
    <!-- Soft light catch on bulb -->
    <path d="M 436 240 C 434 260, 434 295, 436 315" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.2"/>
  </g>

  <!-- Editorial Product Tag Bottom Corner -->
  <text x="450" y="1030" font-family="'Montserrat', sans-serif" font-size="11" font-weight="500" letter-spacing="4" text-anchor="middle" fill="#77716B">Sola Skin · Ritual 01</text>
</svg>